name: Deploy to HoboHost cPanel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Sync to Server
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || '865dev.com/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*
            **/.github*/**
            *.zip
            *.md
            .DS_Store
            .gitignore
