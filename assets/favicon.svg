<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FF5722"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#FF5722" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Rounded Base -->
  <rect width="64" height="64" rx="16" fill="#0F172A"/>
  <!-- Subtle Border Highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>
  <!-- Safety Orange Lightning Bolt -->
  <polygon points="36 6 12 36 32 36 28 58 52 28 32 28 36 6" fill="url(#boltGrad)" filter="url(#glow)"/>
  <!-- Interior Energy Highlight -->
  <polygon points="34 10 16 34 30 34 27 52 46 30 31 30 34 10" fill="#FFA07A" opacity="0.4"/>
</svg>
